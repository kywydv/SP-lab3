<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><title>AST</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
body{font-family:sans-serif;margin:0;padding:10px}
textarea{width:100%;height:70px;font-family:monospace}
.link{fill:none;stroke:#999;stroke-width:1.5}
.node circle{fill:#4c8bf5;stroke:#1d4ed8;stroke-width:2}
.node.leaf circle{fill:#34d399;stroke:#059669}
.node text{font-size:13px}
</style></head><body>
<p>Вставте JSON (<code>./calc input.txt -j ast.json</code>) і натисніть «Показати»:
<button onclick="draw(JSON.parse(ta.value))">Показати</button>
<input type="file" id="f" accept=".json"></p>
<textarea id="ta"></textarea>
<div id="v"></div>
<script>
const ta=document.getElementById("ta");
ta.value="{\"name\":\"Program\",\"children\":[{\"name\":\"= a\",\"children\":[{\"name\":\"+\",\"children\":[{\"name\":\"2\"},{\"name\":\"*\",\"children\":[{\"name\":\"3\"},{\"name\":\"4\"}]}]}]},{\"name\":\"= b\",\"children\":[{\"name\":\"/\",\"children\":[{\"name\":\"^\",\"children\":[{\"name\":\"-\",\"children\":[{\"name\":\"a\"},{\"name\":\"4\"}]},{\"name\":\"2\"}]},{\"name\":\"5\"}]}]},{\"name\":\"= c\",\"children\":[{\"name\":\"+\",\"children\":[{\"name\":\"%\",\"children\":[{\"name\":\"neg\",\"children\":[{\"name\":\"a\"}]},{\"name\":\"5\"}]},{\"name\":\"b\"}]}]},{\"name\":\"print\",\"children\":[{\"name\":\"a\"}]},{\"name\":\"print\",\"children\":[{\"name\":\"b\"}]},{\"name\":\"print\",\"children\":[{\"name\":\"c\"}]},{\"name\":\"print\",\"children\":[{\"name\":\"neg\",\"children\":[{\"name\":\"^\",\"children\":[{\"name\":\"2\"},{\"name\":\"2\"}]}]}]}]}";
function draw(data){
  d3.select("#v").selectAll("*").remove();
  const root=d3.hierarchy(data);
  const dx=60, dy=70;
  d3.tree().nodeSize([dx,dy])(root);
  let x0=Infinity,x1=-Infinity;
  root.each(d=>{x0=Math.min(x0,d.x);x1=Math.max(x1,d.x)});
  const w=Math.max(x1-x0+120,600), h=root.height*dy+100;
  const svg=d3.select("#v").append("svg").attr("width",w).attr("height",h);
  const g=svg.append("g").attr("transform",`translate(${-x0+60},40)`);
  g.selectAll(".link").data(root.links()).join("path").attr("class","link")
    .attr("d",d3.linkVertical().x(d=>d.x).y(d=>d.y));
  const n=g.selectAll(".node").data(root.descendants()).join("g")
    .attr("class",d=>"node"+(d.children?"":" leaf"))
    .attr("transform",d=>`translate(${d.x},${d.y})`);
  n.append("circle").attr("r",7);
  n.append("text").attr("dy",-12).attr("text-anchor","middle").text(d=>d.data.name);
}
document.getElementById("f").onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{ta.value=r.result;draw(JSON.parse(r.result))};
  r.readAsText(e.target.files[0]);
};
draw(JSON.parse(ta.value));
</script></body></html>
